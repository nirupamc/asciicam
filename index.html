<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>funfunfun</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ascii cam using p5js</h1>
    <div class="container">
        <div class="controls">
            <button id="startCamera">Start Camera</button>
            <button id="capturePhoto" disabled>Capture Photo</button>
            <button id="startRecord" disabled>Start Recording</button>
            <button id="stopRecord" disabled>Stop Recording</button>
        </div>
        <div class="filters">
            <label for="asciiSet">ASCII Set:</label>
            <select id="asciiSet">
                <option value="Classic">Classic</option>
                <option value="Blocks">Blocks</option>
                <option value="Dotted">Dotted</option>
            </select>
            <label for="brightness">Brightness:</label>
            <input type="range" id="brightness" min="-100" max="100" value="0">
            <label for="contrast">Contrast:</label>
            <input type="range" id="contrast" min="0.5" max="2" step="0.1" value="1">
        </div>
        <div id="ascii-output"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
